# Publishes a community theme when a maintainer adds the `approved` label to a
# "Submit a theme" issue. Only people with triage/write access can add labels, so
# nothing goes live without the owner's say-so.
#
# Note: pushes made with GITHUB_TOKEN don't start other workflows by themselves.
# The Pages deploy (static.yml) listens for this workflow finishing via workflow_run.
name: Community theme approval

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: community
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'theme-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      # The issue body is passed through the environment, never pasted into a script.
      - name: Check the submission and add it
        id: theme
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: python scripts/community/approve.py

      - name: Publish the theme
        if: steps.theme.outputs.status == 'ok'
        env:
          THEME_NAME: ${{ steps.theme.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/
          git commit -m "Add community theme: ${THEME_NAME} (#${ISSUE_NUMBER})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Thank the submitter and close the issue
        if: steps.theme.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESULT_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Ask for changes
        if: steps.theme.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: |
          gh label create needs-changes --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Theme submission needs fixes" --force
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESULT_FILE"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-changes --remove-label approved
