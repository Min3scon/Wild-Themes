# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Redeploy after an approved community theme is committed (pushes made with
  # GITHUB_TOKEN don't trigger the push event above)
  workflow_run:
    workflows: ["Community theme approval"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read     # to check that the uploaded artifact is listed before deploying it

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build the live theme catalogue (read by the add-in and the extension)
        run: node scripts/build-catalog.js
      - name: Build the extension downloads (Chrome/Edge/Brave and Firefox) from extension/
        run: node scripts/build-extension.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      # GitHub sometimes answers "no artifact found" for a few seconds after an upload that succeeded (the deploy step
      # then fails with "Found 0 artifact(s)"). Wait until the artifact is listed, up to two minutes, then deploy.
      - name: Wait until GitHub lists the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            echo "listed: $n"
            [ "$n" -ge 1 ] && exit 0
            sleep 5
          done
          echo "Not listed yet: deploying anyway"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
