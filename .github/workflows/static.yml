# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Redeploy after an approved community theme is committed (pushes made with
  # GITHUB_TOKEN don't trigger the push event above)
  workflow_run:
    workflows: ["Community theme approval"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url || steps.d4.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build the live theme catalogue (read by the add-in and the extension)
        run: node scripts/build-catalog.js
      - name: Build the extension downloads (Chrome/Edge/Brave and Firefox) from extension/
        run: node scripts/build-extension.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      # GitHub's artifact lookup sometimes answers "Found 0 artifact(s)" for a good upload, and only for some attempts: three
      # runs in a row failed that way, the fourth worked, and listing the artifact over the REST API showed it all along (so
      # waiting for it to be listed doesn't help). The lookup happens before anything is created, so asking again is safe:
      # try up to four times, pausing a little longer each time; the last try is the one whose failure fails the job.
      - name: Deploy to GitHub Pages
        id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause, then try again
        if: steps.d1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (try 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause, then try again
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 40
      - name: Deploy to GitHub Pages (try 3)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause, then try again
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (try 4)
        id: d4
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        uses: actions/deploy-pages@v4
