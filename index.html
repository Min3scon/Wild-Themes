<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Wild Themes</title>
<meta name="description" content="Animated themes for Word, PowerPoint, Excel and Teams, saved inside your files.">
<link rel="icon" href="extension/icons/icon32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="bar">
  <a class="mark" href="./" aria-label="Wild Themes home"><i></i>wild themes</a>
  <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3a6 6 0 1 0 3.7 10.7l3.3 3.3 1.4-1.4-3.3-3.3A6 6 0 0 0 9 3Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
    <input id="q" type="search" placeholder="Search themes" autocomplete="off" aria-label="Search themes"><kbd>/</kbd></label>
  <nav><button class="link" id="open-submit">Submit</button><button class="cta" id="open-install">Add to Chrome</button></nav>
</header>

<main>
  <div class="intro">
    <h1>Themes for Word, PowerPoint, Excel and Teams.</h1>
    <p>Saved inside your file, so anyone who opens it sees it.</p>
  </div>
  <div class="tools">
    <div class="filters" role="radiogroup" aria-label="Filter themes">
      <button role="radio" data-f="all" aria-checked="true">All</button><button role="radio" data-f="dark">Dark</button><button role="radio" data-f="light">Light</button><button role="radio" data-f="community">Community</button>
    </div>
    <div class="seg motion-all" role="radiogroup" aria-label="Motion"><button role="radio" data-m="1" aria-checked="true">Animated</button><button role="radio" data-m="0">Still</button></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>
<footer>Unofficial · not affiliated with Microsoft · <a href="https://github.com/Min3scon/Wild-Themes">GitHub</a></footer>

<iframe class="peek" id="peek" title="" aria-hidden="true" tabindex="-1"></iframe>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <button class="x" id="close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</aside>

<template id="t-theme">
  <iframe class="stage" title="Theme preview"></iframe>
  <div class="head"><h2 id="sheet-title"></h2><p class="meta"></p></div>
  <label class="drop"><input type="file" accept=".docx,.pptx,.xlsx"><b>Drop a Word, PowerPoint or Excel file</b><span>The themed copy downloads straight away. It never leaves your computer.</span></label>
  <p class="msg" role="status"></p>
  <div class="acts"><button data-a="starter">Word starter</button><button data-a="teams">Teams background</button><button data-a="ext">Use in extension</button><button data-a="remove">Remove a theme…</button></div>
</template>

<template id="t-install">
  <h2 id="sheet-title">Add to Chrome</h2>
  <p class="lede">Chrome only installs from its Web Store with one click. Until Wild Themes is there, it takes three steps.</p>
  <a class="cta wide" href="downloads/wild-themes-extension.zip" download>Download extension</a>
  <ol class="steps"><li>Unzip the download.</li><li>Open <code>chrome://extensions</code> <button class="copy" data-copy="chrome://extensions">Copy</button> and turn on <b>Developer mode</b>.</li><li>Click <b>Load unpacked</b> and choose the unzipped folder.</li></ol>
  <p class="fine">Works in Chrome, Edge, Brave and Arc. On the desktop apps, themes come from your files instead: <a href="addin/manifest.xml" download>Office add-in</a> · <a href="downloads/wild-theme-documents.zip">18 themed documents</a></p>
</template>

<template id="t-submit">
  <h2 id="sheet-title">Submit a theme</h2>
  <p class="lede">Make one from a picture or three colours. It goes live once it's approved.</p>
  <label class="field">Name<input id="s-name" maxlength="30" placeholder="Midnight Harbour"></label>
  <div class="seg" role="radiogroup" aria-label="Made from"><button role="radio" data-k="picture" aria-checked="true">Picture</button><button role="radio" data-k="colours">Colours</button></div>
  <div data-for="picture"><label class="drop small"><input type="file" id="s-pic" accept="image/png,image/jpeg,image/webp"><b>Choose a picture</b><span>At least 1280×720. Shrunk to fit 2 MB.</span></label></div>
  <div data-for="colours" hidden class="swatches"><input type="color" id="s-c1" value="#120a2a" aria-label="Background"><input type="color" id="s-c2" value="#ff2bd6" aria-label="Glow 1"><input type="color" id="s-c3" value="#21e6ff" aria-label="Glow 2">
    <select id="s-fx" aria-label="Effect"><option value="none">No effect</option><option value="stars">Twinkling stars</option><option value="snow">Snow</option><option value="bubbles">Bubbles</option><option value="confetti">Confetti</option></select></div>
  <div class="mini" id="s-prev"></div>
  <p class="msg" id="s-msg" role="status"></p>
  <button class="cta wide" id="s-go" disabled>Continue on GitHub</button>
  <p class="fine">Opens a GitHub form filled in for you. Drag the downloaded picture into it and send. Max 2 MB, PNG, JPG or WebP.</p>
</template>

<script src="extension/lib/themes.js"></script>
<script src="site.js"></script>
</body>
</html>
